<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src http://localhost:11434 https://generativelanguage.googleapis.com https://openrouter.ai https://api.elevenlabs.io https://api.groq.com http://127.0.0.1:19765; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:;">
  <title>Waifu Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <!-- Header with state indicator and settings -->
    <div class="header">
      <div id="state-indicator" class="indicator idle"></div>
      <span id="state-label">Ready</span>
      <span id="presence-indicator" class="presence-idle"></span>
      <button id="settings-btn" class="settings-btn" title="Settings">⚙️</button>
    </div>

    <!-- Settings panel (hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-group">
        <label class="settings-label">Model</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="model-mode" value="local_only">
            <span>Local Only</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="model-mode" value="cloud_preferred">
            <span>Cloud (fallback)</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="model-mode" value="cloud_only">
            <span>Cloud Only</span>
          </label>
        </div>
      </div>
      <div id="cloud-provider-group" class="settings-group hidden">
        <label class="settings-label">Cloud Provider</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="cloud-provider" value="gemini" checked>
            <span>Google Gemini</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="cloud-provider" value="openrouter">
            <span>OpenRouter</span>
          </label>
        </div>
      </div>

      <div id="api-key-group" class="settings-group hidden">
        <label class="settings-label" for="api-key-input">Gemini API Key</label>
        <input type="password" id="api-key-input" placeholder="Enter Gemini API key" autocomplete="off">
      </div>

      <div id="openrouter-key-group" class="settings-group hidden">
        <label class="settings-label" for="openrouter-key-input">OpenRouter API Key</label>
        <input type="password" id="openrouter-key-input" placeholder="Enter OpenRouter API key" autocomplete="off">
      </div>

      <!-- Avatar Model Selection -->
      <div class="settings-group">
        <label class="settings-label" for="model-select">Avatar Model</label>
        <select id="model-select" class="settings-select">
          <option value="" disabled selected>Loading...</option>
        </select>
        <div id="model-capabilities" class="capabilities-container hidden">
          <!-- Badges injected here -->
        </div>
      </div>

      <div class="settings-group">
        <label class="checkbox-option">
          <input type="checkbox" id="avatar-toggle">
          <span>Show Live2D Avatar</span>
        </label>
      </div>

      <!-- Voice Settings -->
      <div class="settings-group">
        <label class="checkbox-option">
          <input type="checkbox" id="voice-toggle">
          <span>Voice Enabled</span>
        </label>
      </div>

      <div id="voice-settings-group" class="settings-group hidden">
        <label class="settings-label">TTS Engine</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="tts-engine" value="system" checked>
            <span>System</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="tts-engine" value="styletts2">
            <span>Neural (Exp)</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="tts-engine" value="elevenlabs">
            <span>ElevenLabs</span>
          </label>
        </div>
      </div>

      <div id="elevenlabs-settings-group" class="settings-group hidden">
        <label class="settings-label" for="elevenlabs-key-input">ElevenLabs API Key</label>
        <input type="password" id="elevenlabs-key-input" placeholder="Paste your ElevenLabs API key"
          autocomplete="off">
        <label class="settings-label" for="elevenlabs-voice-select" style="margin-top: 8px;">Voice</label>
        <select id="elevenlabs-voice-select" class="settings-select"></select>
        <button id="elevenlabs-test-btn" class="action-btn"
          style="margin-top: 8px; padding: 6px 10px; font-size: 12px;">
          Test ElevenLabs
        </button>
        <div id="elevenlabs-test-status" style="margin-top: 6px; font-size: 11px; color: #ccc;"></div>
      </div>

      <!-- Speech-to-Text (Groq Whisper) -->
      <div class="settings-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 4px;">
        <label class="settings-label" for="groq-stt-key-input">🎤 Speech-to-Text (Groq Whisper)</label>
        <input type="password" id="groq-stt-key-input" placeholder="Groq API key — free at console.groq.com" autocomplete="off">
        <div style="margin-top: 4px; font-size: 10px; color: #6b7280;">Hold mic button or Space to talk</div>
      </div>

      <!-- TEMPORARY: Debug Emotion Triggers -->
      <div class="settings-group"
        style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 10px;">
        <label class="settings-label">Debug Exps (Testing Only)</label>
        <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;">
          <button id="btn-dbg-happy" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Happy</button>
          <button id="btn-dbg-sad" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Sad</button>
          <button id="btn-dbg-crying" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Crying</button>
          <button id="btn-dbg-angry" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Angry</button>
          <button id="btn-dbg-dark" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Dark</button>
          <button id="btn-dbg-playful" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Playful</button>
          <button id="btn-dbg-surprised" class="action-btn"
            style="padding: 4px 8px; font-size: 11px;">Surprised</button>
          <button id="btn-dbg-embarrassed" class="action-btn"
            style="padding: 4px 8px; font-size: 11px;">Embarrassed</button>
          <button id="btn-dbg-excited" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Excited</button>
          <button id="btn-dbg-sleepy" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Sleepy</button>
          <button id="btn-dbg-smug" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Smug</button>
          <button id="btn-dbg-love" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Love</button>
          <button id="btn-dbg-confused" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Confused</button>
          <button id="btn-dbg-scared" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Scared</button>
          <button id="btn-dbg-disgusted" class="action-btn"
            style="padding: 4px 8px; font-size: 11px;">Disgusted</button>
          <button id="btn-dbg-determined" class="action-btn"
            style="padding: 4px 8px; font-size: 11px;">Determined</button>
          <button id="btn-dbg-curious" class="action-btn" style="padding: 4px 8px; font-size: 11px;">Curious</button>
          <button id="btn-dbg-neutral" class="action-btn"
            style="padding: 4px 8px; font-size: 11px; background: rgba(255,255,255,0.15);">⟲ Neutral</button>
        </div>
      </div>
    </div>

    <!-- Response area -->
    <div id="response-area" class="response-area">
      <p class="placeholder">Miko is here. say something soft…</p>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <input type="text" id="user-input" placeholder="whisper to Miko…" autocomplete="off" autofocus>
      <button id="mic-btn" class="mic-btn" title="Hold to speak (or hold Space)">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="22" x2="15" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>

</html>
